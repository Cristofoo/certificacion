{% extends 'base.html' %}
{% block content %}
  <h1>Solicitar Asesoría</h1>
  <form method="post" action="{{ url_for('asesorias.nueva_asesoria') }}">
    <label>Tema</label>
    <input type="text" name="tema" value="{{ asesoria.tema if asesoria }}" required>
    <label>Fecha</label>
  <input type="date" name="fecha" value="{{ asesoria.fecha if asesoria }}" min="{{ today }}" required>
    <label>Duración (horas)</label>
    <input type="number" name="duracion" min="1" max="8" value="{{ asesoria.duracion if asesoria }}" required>
    <label>Notas</label>
    <textarea name="notas" maxlength="50">{{ asesoria.notas if asesoria }}</textarea>
    <label>Tutor</label>
    {% if usuarios and usuarios|length > 0 %}
    <select name="tutor_id">
      <option value="">-- Seleccione un tutor --</option>
      {% for u in usuarios %}
        <option value="{{ u.id }}">{{ u.nombre or '' }} {{ u.apellido or '' }}</option>
      {% endfor %}
    </select>
    {% else %}
      <p class="muted">No hay tutores disponibles. Asegúrate de haber ejecutado el script de base de datos o creado tutores.</p>
    {% endif %}
  <button type="submit">Guardar</button>
  <a class="button" href="/">Volver</a>
  </form>
{% endblock %}
